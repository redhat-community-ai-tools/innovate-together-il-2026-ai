# Internal preview site for the AI track agenda / skill handoff.
# After the first successful pipeline: Settings → Pages for the URL.

stages:
  - deploy

pages:
  stage: deploy
  image: python:3.12-alpine
  script:
    - python scripts/build_pages.py
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
